<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 43 · Journal</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/journal.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" id="nav" aria-label="Journal">
    <div class="product">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="var(--accent)"/><circle cx="12" cy="12" r="3.2" fill="#fff"/></svg>
      <div>
        <div class="product-name">Journal</div>
        <div class="product-scope">Europe/London</div>
      </div>
      <button class="btn ghost menu-close" type="button" aria-label="Close menu" data-menu>Close</button>
    </div>

    <a class="nav-item" href="#today">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
      Today <span class="nav-meta">Thu 22</span>
    </a>
    <a class="nav-item" href="#week" aria-current="page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M5.8 2.5v11M10.2 2.5v11"/></svg>
      Week <span class="nav-meta">43</span>
    </a>
    <a class="nav-item" href="#future">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2 8h10M8.5 4.5 12 8l-3.5 3.5"/><path d="M14.5 3v10"/></svg>
      Future log
    </a>

    <div class="group-label">Recent weeks</div>
    <a class="nav-item" href="#w42">Week 42 <span class="nav-meta">12–16 Oct</span></a>
    <a class="nav-item" href="#w41">Week 41 <span class="nav-meta">5–9 Oct</span></a>

    <div class="bottom">
      <a class="nav-item" href="#settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        Settings
      </a>
      <div class="sync">
        <span>Outlook synced <span class="num" data-synced></span></span>
        <button class="card-link" type="button">Refresh</button>
      </div>
    </div>
  </nav>

  <main class="canvas" id="week">
    <header class="phone-bar">
      <button class="btn ghost menu-toggle" type="button" aria-controls="nav" aria-expanded="false" data-menu>Menu</button>
      <span class="phone-title">Week 43</span>
    </header>

    <div class="column">
      <div class="title-row">
        <div>
          <h1 class="greeting" data-greeting></h1>
          <p class="sub" data-facts></p>
        </div>
        <form class="composer" onsubmit="return false">
          <div class="segmented" role="group" aria-label="Entry type">
            <button type="button" aria-pressed="true" title="Task (t)"><span class="sig">•</span> Task</button>
            <button type="button" aria-pressed="false" title="Note (–)"><span class="sig">–</span> Note</button>
            <button type="button" aria-pressed="false" title="Event (o)"><span class="sig">○</span> Event</button>
          </div>
          <label class="visually-hidden" for="quick-add">Add to Thursday</label>
          <input class="input" id="quick-add" placeholder="Add to Thursday" autocomplete="off">
          <button class="btn primary" type="submit">Add <kbd>N</kbd></button>
        </form>
      </div>

      <section class="spread" aria-label="Week 43, Monday to Friday" data-spread></section>

      <div class="lower">
        <section class="panel ahead" aria-labelledby="ahead-h">
          <header><h2 id="ahead-h">Ahead</h2><a class="card-link" href="#future" data-ahead-more>Future log</a></header>
          <ul class="rows" data-ahead></ul>
        </section>
        <section class="panel rolling" aria-labelledby="rolling-h">
          <header><h2 id="rolling-h">Rolling over</h2><span class="meta" data-rolling-count></span></header>
          <ul class="rows" data-rolling></ul>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="week-data.js"></script>
<script src="week.js"></script>
</body>
</html>
